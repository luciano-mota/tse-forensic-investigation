server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: tse-forensic-investigation
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/tse_forensic}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
forensic:
  import:
    path: ${FORENSIC_IMPORT_PATH:}
    charset: ${FORENSIC_IMPORT_CHARSET:ISO-8859-1}
logging:
  level:
    root: INFO
