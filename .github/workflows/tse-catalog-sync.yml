name: Preservar versões do catálogo oficial TSE
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/tse_sync.py
      - scripts/tse_live_extract.py
      - .github/workflows/tse-catalog-sync.yml
permissions:
  contents: write
concurrency:
  group: tse-official-catalog-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive collector
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Checkout immutable history branch separately
        run: |
          git fetch origin archive-history:refs/remotes/origin/archive-history
          git worktree add history origin/archive-history
      - name: Prepare optional S3 client
        run: python -m pip install --disable-pip-version-check boto3==1.38.17
      - name: Read TSE and archive official resources if storage is configured
        env:
          ARCHIVE_BUCKET: ${{ secrets.TSE_ARCHIVE_BUCKET }}
          ARCHIVE_ENDPOINT: ${{ secrets.TSE_ARCHIVE_ENDPOINT }}
          ARCHIVE_REGION: ${{ secrets.TSE_ARCHIVE_REGION }}
          ARCHIVE_ACCESS_KEY_ID: ${{ secrets.TSE_ARCHIVE_ACCESS_KEY_ID }}
          ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.TSE_ARCHIVE_SECRET_ACCESS_KEY }}
        run: |
          python scripts/tse_sync.py --archive-dir history/archive --max-files 4 --max-file-mb 250
      - name: Extract official national presidential results without long-term ZIP storage
        # Fail closed: never publish partial aggregates when the TSE cannot be read.
        run: python -m scripts.tse_live_extract --history-dir history
      - name: Record observations on archive-history without redeploying main
        if: always()
        run: |
          if [ -d history/archive ]; then
            git -C history config user.name "tse-forensic-bot"
            git -C history config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C history add archive/
            if ! git -C history diff --cached --quiet; then
              git -C history commit -m "data: preserve TSE catalog snapshot"
              git -C history push origin HEAD:archive-history
            fi
          fi
