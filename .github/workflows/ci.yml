name: Build and test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests and package
        run: mvn -B -ntp verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify catalog snapshots, immutable history, and URL allowlist
        run: python -m unittest discover -s tests -p 'test_tse_sync.py' -v
